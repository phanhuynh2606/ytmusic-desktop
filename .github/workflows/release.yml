name: Release Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# One release per tag; do not cancel mid-publish (assets would be partial).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read # for @venipa/oxsms github hosted package

env:
  NODE_VERSION: "24.14.0"
  COMPILE_ARTIFACT: electron-compile

jobs:
  # Shared electron-vite build (sidecar builds world0 + embeds).
  # Pack jobs download this artifact and run electron-builder only (no vite).
  compile:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.getVersion.outputs.value }}
      version_ok: ${{ steps.getVersion.outputs.ok }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - if: github.ref_type == 'tag'
        id: getVersion
        uses: actions/github-script@v9
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const isVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
            const id = process.env.REF_NAME && process.env.REF_NAME.split('v')[1] || process.env.REF_NAME
            const isRC = id.includes('-rc.')
            core.setOutput("value", id);
            core.setOutput("ok", String(isVersion.test(id)))
            core.setOutput("releaseType", isRC ? 'rc' : 'stable')

      # outputs.ok is the string "true"/"false" — bare `if: outputs.ok` is truthy for "false".
      - if: github.ref_type == 'tag' && steps.getVersion.outputs.ok == 'true'
        name: set app version
        shell: bash
        env:
          APP_VERSION: ${{ steps.getVersion.outputs.value }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const p = 'apps/ytmdesktop2/package.json';
          const text = fs.readFileSync(p, 'utf8');
          const next = text.replace(/("version"\s*:\s*")[^"]*(")/, `$1${process.env.APP_VERSION}$2`);
          fs.writeFileSync(p, next);
          EOF

      - name: Prepare pnpm / auth
        shell: bash
        run: |
          rm -f .npmrc
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
            echo "@venipa:registry=https://npm.pkg.github.com"
            echo "@venipa/*:registry=https://npm.pkg.github.com"
          } >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Electron app
        run: pnpm release:compile
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          VITE_LASTFM_API: ${{ secrets.LASTFM_API }}
          VITE_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_APP_GIT_HASH: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}

      - name: Verify compile output
        shell: bash
        run: |
          test -f apps/ytmdesktop2/out/main/index.js
          test -f apps/ytmdesktop2/resources/embeds/now-playing/index.html
          test -f apps/ytmdesktop2/src/preload/generated/ytmd-world0-host.js

      # out/ + resources/embeds (sidecar). upload-artifact strips common apps/ytmdesktop2 prefix.
      - name: Upload compile artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: |
            apps/ytmdesktop2/out
            apps/ytmdesktop2/resources/embeds
          if-no-files-found: error
          retention-days: 3

      # Avoid parallel pack jobs racing on release create.
      - if: github.ref_type == 'tag'
        name: Ensure draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          title="v${{ steps.getVersion.outputs.value }} - "
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --draft --title "$title" --notes "Publishing assets…"
          fi

  build-windows:
    needs: compile
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - if: needs.compile.outputs.version_ok == 'true'
        name: set app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.compile.outputs.version }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const p = 'apps/ytmdesktop2/package.json';
          const text = fs.readFileSync(p, 'utf8');
          const next = text.replace(/("version"\s*:\s*")[^"]*(")/, `$1${process.env.APP_VERSION}$2`);
          fs.writeFileSync(p, next);
          EOF

      - name: Prepare pnpm / auth
        shell: pwsh
        run: |
          Remove-Item -Path .npmrc -ErrorAction Ignore
          Add-Content -Path .npmrc -Value "registry=https://registry.npmjs.org/"
          Add-Content -Path .npmrc -Value "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
          Add-Content -Path .npmrc -Value "@venipa:registry=https://npm.pkg.github.com"
          Add-Content -Path .npmrc -Value "@venipa/*:registry=https://npm.pkg.github.com"

      - name: install windows deps
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.5
        with:
          sdk-version: 20348

      # windows-2025-vs2026 ships VS 2026 (18.x). node-gyp <12.1 cannot detect it
      # (@electron/rebuild used to pull node-gyp@11 → install-app-deps fails on @parcel/watcher).
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_msvs_version: "2026"

      # Artifact root is out/ + resources/ (common apps/ytmdesktop2 prefix stripped).
      - name: Download compile artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: apps/ytmdesktop2

      - name: Verify compile output
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "apps/ytmdesktop2/out/main/index.js")) {
            throw "missing apps/ytmdesktop2/out/main/index.js"
          }
          if (-not (Test-Path -LiteralPath "apps/ytmdesktop2/resources/embeds/now-playing/index.html")) {
            throw "missing embeds now-playing/index.html"
          }

      - name: Pack Windows release
        run: pnpm release:pack:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          VITE_LASTFM_API: ${{ secrets.LASTFM_API }}
          VITE_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

  finalize-release:
    needs:
      - build-windows
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          echo "Tag=$tag Version=$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release notes from commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          prev=""
          if prev=$(gh release list --exclude-drafts --limit 20 --json tagName --jq ".[] | select(.tagName != \"$tag\") | .tagName" | head -n1); then
            :
          else
            prev=""
          fi

          if [ -z "$prev" ]; then
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          fi

          if [ -z "$prev" ]; then
            echo "No previous published release — listing all commits reachable from $tag"
            git log --pretty=tformat:"- %s (%h)" "$tag" > release-notes-commits.txt || true
          else
            echo "Commits: $prev..$tag"
            git log --pretty=tformat:"- %s (%h)" "$prev..$tag" > release-notes-commits.txt || true
          fi

          if [ ! -s release-notes-commits.txt ]; then
            echo "- No commits listed for this range." > release-notes-commits.txt
          fi

          {
            echo "## Changes"
            echo
            cat release-notes-commits.txt
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Set draft release title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          gh release edit "$tag" \
            --draft \
            --title "v$version - " \
            --notes-file release-notes.md
